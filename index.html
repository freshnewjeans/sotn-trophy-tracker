<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Castlevania Requiem — Trophy Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOTN Trophies">
<meta name="theme-color" content="#f5f5f7">
<style>
  :root{
    --bg:#ececf0; --window:#f5f5f7; --sidebar:rgba(238,238,242,0.72);
    --card:#ffffff; --card-hover:#f2f2f5; --stroke:rgba(0,0,0,0.08); --stroke2:rgba(0,0,0,0.14);
    --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6;
    --accent:#0a84ff; --green:#28c840; --amber:#f5a623; --red:#ff3b30;
    --gold:#b8860b; --silver:#8e8e93; --bronze:#a06b3d; --platinum:#c8c8d0;
    --radius:10px; --radius-lg:14px; --shadow:0 24px 70px rgba(0,0,0,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(1100px 640px at 82% -8%,#f6e9dc 0%,transparent 55%),radial-gradient(800px 540px at -8% 112%,#e2ecfa 0%,transparent 55%),var(--bg);
    color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;
    display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;}
  .window{width:min(1240px,100%);height:min(880px,96vh);background:var(--window);
    border-radius:var(--radius-lg);box-shadow:var(--shadow),0 0 0 .5px rgba(0,0,0,.08);
    display:flex;flex-direction:column;overflow:hidden;}
  .titlebar{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:rgba(246,246,249,.72);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    border-bottom:1px solid var(--stroke);}
  .traffic{display:flex;gap:8px}.traffic span{width:12px;height:12px;border-radius:50%;display:block}
  .t-red{background:#ff5f57}.t-yellow{background:#febc2e}.t-green{background:#28c840}
  .ttitle{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .ttitle .ic{width:22px;height:22px;border-radius:6px;background:linear-gradient(160deg,#8a2b35,#c79a5a);
    display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800;flex:0 0 auto}
  .progress-wrap{display:flex;align-items:center;gap:10px}
  .pct{font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
  .ptrack{width:180px;height:6px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden}
  .pfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#0a84ff,#64d2ff);transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .toolbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--stroke);flex-wrap:wrap}
  .seg{display:flex;background:rgba(0,0,0,.06);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
  .seg button{appearance:none;border:0;background:transparent;color:var(--text2);font-size:12.5px;font-weight:500;
    padding:7px 12px;border-radius:6px;cursor:pointer;font-family:inherit;transition:all .15s ease;min-height:30px}
  .seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .search{margin-left:auto;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.06);border-radius:8px;padding:7px 11px;min-width:200px}
  .search input{background:transparent;border:0;outline:0;color:var(--text);font-size:13px;font-family:inherit;width:100%;min-height:28px}
  .search input::placeholder{color:var(--text3)}
  .body{flex:1;display:flex;min-height:0}
  .sidebar{flex:0 0 248px;background:var(--sidebar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    border-right:1px solid var(--stroke);padding:14px 10px;overflow-y:auto}
  .side-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:8px 10px 6px}
  .side-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);margin-bottom:1px;transition:background .12s ease;min-height:34px}
  .side-item:hover{background:rgba(0,0,0,.05);color:var(--text)}
  .side-item.active{background:rgba(10,132,255,.18);color:#0a5dc2}
  .side-item .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .side-item .cnt{margin-left:auto;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
  .side-item .cnt.done{color:var(--green)}
  .main{flex:1;overflow-y:auto;padding:22px 26px 90px;min-width:0}
  .phase-head{margin-bottom:16px}
  .pk{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
  .pt{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
  .pd{font-size:13.5px;color:var(--text2);margin-top:6px;line-height:1.5;max-width:680px}
  .trophy{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:background .15s ease,border-color .15s ease}
  .trophy:hover{background:var(--card-hover)}
  .trow{display:flex;align-items:center;gap:13px;padding:13px 15px;cursor:pointer;min-height:52px}
  .check{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid var(--text3);display:grid;place-items:center;position:relative;transition:all .18s ease}
  .check::after{content:"";position:absolute;inset:-11px;border-radius:50%}
  .check svg{opacity:0;transform:scale(.5);transition:all .18s ease}
  .trophy.done .check{background:var(--green);border-color:var(--green)}
  .trophy.done .check svg{opacity:1;transform:scale(1)}
  .trophy.done .tn{color:var(--text3);text-decoration:line-through}
  .tier{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.02em}
  .tier.bronze{background:rgba(160,107,61,.16);color:var(--bronze)}
  .tier.silver{background:rgba(142,142,147,.16);color:var(--silver)}
  .tier.gold{background:rgba(184,134,11,.18);color:var(--gold)}
  .tier.platinum{background:linear-gradient(145deg,#e8e8ed,#9a9aa2);color:#1c1c1e}
  .tb{flex:1;min-width:0}
  .tn{font-size:14px;font-weight:600;transition:color .15s}
  .ts{font-size:12px;color:var(--text3);margin-top:2px;line-height:1.4}
  .badges{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap}
  .badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
  .badge.missable{background:rgba(245,166,35,.18);color:#b26a00}
  .badge.critical{background:rgba(255,59,48,.16);color:#d70015}
  .badge.grind{background:rgba(10,132,255,.14);color:#0a6fd6}
  .badge.story{background:rgba(0,0,0,.05);color:var(--text2)}
  .chev{color:var(--text3);transition:transform .2s ease;flex:0 0 auto}
  .trophy.open .chev{transform:rotate(90deg)}
  .tdetail{max-height:0;overflow:hidden;transition:max-height .28s ease;border-top:0 solid var(--stroke)}
  .trophy.open .tdetail{max-height:2000px;border-top-width:1px}
  .tdi{padding:13px 16px 15px 60px;font-size:13px;line-height:1.62;color:var(--text2)}
  .tdi strong{color:var(--text)}
  .guide-block{margin-top:6px}
  .guide-block h4{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px}
  .guide-block p{margin:0 0 7px}
  .tip{margin-top:8px;padding:9px 12px;border-radius:8px;background:rgba(10,132,255,.08);border-left:3px solid var(--accent);color:#0a5dc2;font-size:12.5px;line-height:1.55}
  .tip.warn{background:rgba(245,166,35,.10);border-left-color:var(--amber);color:#9c6a00}
  .tip.crit{background:rgba(255,59,48,.08);border-left-color:var(--red);color:#c21f12}
  .platinum-card{background:linear-gradient(135deg,rgba(200,200,210,.14),rgba(200,200,210,.03));border:1px solid rgba(120,120,135,.3);border-radius:var(--radius-lg);padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:22px}
  .platinum-card .medal{width:46px;height:46px;border-radius:12px;flex:0 0 auto;background:linear-gradient(145deg,#e8e8ed,#a8a8b0);display:grid;place-items:center;color:#1c1c1e;font-weight:800;font-size:13px}
  .platinum-card h3{font-size:16px;font-weight:700}.platinum-card p{font-size:12.5px;color:var(--text2);margin-top:2px}
  .empty{color:var(--text3);font-size:13px;padding:30px;text-align:center}
  .footnote{margin-top:30px;font-size:11.5px;color:var(--text3);line-height:1.6;border-top:1px solid var(--stroke);padding-top:14px}
  .creditbar{flex:0 0 auto;text-align:center;font-size:11px;color:#86868b;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--stroke);background:rgba(246,246,249,.6)}
  .maphdr{margin-bottom:14px}.maphdr .pk{color:var(--accent)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--text2)}
  .lg{display:flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15);flex:0 0 auto}
  .mapcard{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .mapcard h3{font-size:14px;font-weight:600;margin-bottom:4px}
  .mapcard .cap{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.5}
  .mapsvg{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mapsvg svg{display:block;max-width:none}
  .guidepage{max-width:820px}
  .guide-section{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
  .guide-section h2{font-size:16px;font-weight:700;margin-bottom:8px}
  .guide-section .sub{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px}
  .guide-section h3{font-size:13px;font-weight:600;margin:12px 0 6px;color:var(--text)}
  .guide-section ul{margin:0 0 8px 18px}.guide-section li{margin-bottom:5px;font-size:13px;line-height:1.55;color:var(--text2)}
  .guide-section p{font-size:13px;line-height:1.6;color:var(--text2);margin-bottom:8px}
  .tbadge{flex:0 0 auto;width:34px;height:34px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18));transition:opacity .18s ease,filter .18s ease}
  .trophy.done .tbadge{opacity:.42;filter:grayscale(.5)}
  .tbadge-svg{width:100%;height:100%;display:block}
  .guide-img{margin:10px 0 4px;border-radius:10px;overflow:hidden;border:1px solid var(--stroke);background:#111}
  .guide-img img{display:block;width:100%;height:auto;max-height:400px;object-fit:contain;background:#0b0b0f}
  .guide-img .gi-cap{font-size:11px;color:var(--text3);padding:6px 10px;background:var(--card)}
  .stage-card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
  .stage-card .sc-img{background:#0b0b0f;border-bottom:1px solid var(--stroke)}
  .stage-card .sc-img img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}
  .stage-card .sc-body{padding:12px 15px}
  .stage-card h3{font-size:14px;font-weight:600}
  .sc-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;margin:6px 6px 4px 0;background:rgba(10,132,255,.12);color:#0a6fd6;text-transform:uppercase;letter-spacing:.03em}
  .sc-tag.rescue{background:rgba(245,166,35,.16);color:#b26a00}
  .sc-tag.boss{background:rgba(255,59,48,.14);color:#d70015}
  .sc-cap{font-size:12.5px;color:var(--text2);line-height:1.55;margin-top:4px}
  .realmap-card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
  .realmap-card a.rm-link{display:block;background:#0b0b0f;border-bottom:1px solid var(--stroke)}
  .realmap-card img{display:block;width:100%;height:auto;object-fit:contain;cursor:zoom-in}
  .realmap-body{padding:12px 15px}
  .realmap-body h3{font-size:14px;font-weight:600;margin:0 0 6px}
  .realmap-body p{font-size:12.5px;color:var(--text2);line-height:1.6;margin:4px 0 0}
  .rm-hint{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(10,132,255,.12);color:#0a6fd6;text-transform:uppercase;letter-spacing:.03em;margin-top:8px}
  @media (max-width:820px){
    body{padding:0;align-items:stretch}.window{height:100vh;border-radius:0;width:100%}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:50;transform:translateX(-102%);transition:transform .25s ease;box-shadow:2px 0 30px rgba(0,0,0,.15)}
    .sidebar.open{transform:translateX(0)}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
    .scrim.show{opacity:1;pointer-events:auto}
    .hamburger{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:rgba(0,0,0,.05);border:0;color:var(--text)}
    .ptrack{width:90px}
    .main{padding:16px 14px 90px}
    .tdi{padding-left:16px}
    .badges{display:none}
  }
  @media (min-width:821px){.hamburger{display:none}.scrim{display:none}}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="window">
  <div class="titlebar">
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="traffic"><span class="t-red"></span><span class="t-yellow"></span><span class="t-green"></span></div>
    <div class="ttitle"><span class="ic">SOTN</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Castlevania Requiem — Trophy Tracker</span></div>
    <div class="progress-wrap"><div class="ptrack"><div class="pfill" id="pfill"></div></div><div class="pct" id="ppct">0 / 44</div></div>
  </div>
  <div class="toolbar">
    <div class="seg" id="seg">
      <button data-f="all" class="active">All</button><button data-f="sotn">SOTN</button><button data-f="rondo">Rondo</button>
      <button data-f="missable">Missables</button><button data-f="todo">To Do</button>
    </div>
    <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="search" type="search" placeholder="Search trophies…"></div>
  </div>
  <div class="body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
  <div class="creditbar">Created and designed by Kevin Lim Fung Yen</div>
</div>

<script>
/* ================= TROPHY DATA ================= */
const PLATINUM={n:"A Miserable Little Pile of Secrets",t:"Unlock all trophies in the collection."};
const PHASES=[
{id:"rondo1",game:"rondo",kick:"Act 1 · Rondo of Blood",title:"First Run — Richter",desc:"Play Rondo of Blood through to Dracula. Rescue every girl on the way — several trophies are missable if you skip them.",trophies:[
{n:"Prayers Answered",t:"Rescue Tera.",b:["story"],img:"img/rondo/rondo-tera.jpg",imgCap:"Rondo of Blood — saving Tera on Stage 3′ (alternate route).",tip:"Tera is on Stage 3′ (the alternate route). In the first room, do NOT take the exit — break the wall below it.",g:"Tera is held on Stage 3′ of Rondo of Blood — the ALTERNATE route. To get onto the alternate branch, take the secret passage on Stage 1: after the hall with the burning buildings, take the stairs down, do NOT take the right door, go left past the pit and whip the wall to reveal the secret path (this puts you on 1 → 2′ → 3′…). On Stage 3′, at the end of the FIRST room, do not leave through the normal exit — go just below that exit and hit the wall to open a hidden passage. In the next room, find the RED RAMP and take the staircase it guards, which leads up into the cave room where Tera is kneeling in prayer. Walk up to her to trigger the rescue cutscene and unlock the trophy. Best time: your first Rondo run, right after you open the alternate route. Common mistake: taking the normal exit at the end of the first room and missing the hidden wall below it."},
{n:"Just What the Doctor Ordered",t:"Rescue Iris.",b:["story"],img:"img/rondo/rondo-iris.jpg",imgCap:"Rondo of Blood — saving Iris on Stage 4′ (alternate route).",tip:"Iris is on Stage 4′ (alternate). Whip the two frog statues to lower a log, then take the stairs into the cave.",g:"Iris is held on Stage 4′ — the ALTERNATE route of Rondo of Blood (the same alternate branch you used for Tera: secret passage on Stage 1 → 2′ → 3′ → 4′). At the start of the SECOND room of Stage 4′, you'll see a small stone FROG STATUE — whip it so it sinks into the ground. Continue right and whip the SECOND frog statue near the end of the area. Now walk back: one of the wooden bridge logs has dropped, opening a gap, and next to a frog statue there is a STAIRWAY leading down into a fishmen-inhabited cave. Follow the cave to the right until you reach the gate blocking the small cabin where Iris is held. Walk up to her to trigger the cutscene and unlock the trophy. Best time: right after rescuing Tera, while you're on the alternate route. Common mistake: not whipping both frog statues, so the log never drops and the cave entrance never opens."},
{n:"Nothing but Annette",t:"Rescue Annette.",b:["story","missable"],img:"img/rondo/rondo-annette.jpg",imgCap:"Rondo of Blood — saving Annette on Stage 7 (Clock Tower).",tip:"Annette is on Stage 7 (Clock Tower). Hit the gear to open the eagle door, beat the eagle for the key, then open the locked door.",g:"Annette is held on Stage 7 — the Clock Tower near the castle keep, a MAIN-route stage (not an alternate). Cross the long bat-infested bridge into the tower. In the tower's SECOND room, climb to the very top and whip the GEAR above the door about seven times to open a door on the right. This leads outside to an eagle's perch — defeat the eagle (the bird) so it drops the KEY it wears around its neck. Take the key to the NEXT section of the tower and use it to open the locked door at its bottom; Annette is waiting safely inside. Walk up to her to trigger the cutscene and unlock the trophy. Best time: your first run when you reach Stage 7. Common mistake: missing the gear high up, or not going outside to fight the eagle for the key."},
{n:"The Young Huntress",t:"Rescue Maria Renard.",b:["story","missable"],img:"img/rondo/rondo-maria.jpg",imgCap:"Rondo of Blood — saving Maria on Stage 2.",tip:"Maria is on Stage 2. When the behemoth chases you, break the 3rd candle to get the key to her door.",g:"Maria is held on Stage 2 of Rondo of Blood. First get the KEY: while the large behemoth monster is chasing you through the stage, destroy the THIRD candle to make it drop the key that opens her cell. With the key, continue to the fishmen room — Maria's door is on the EAST side of that room. Enter, defeat the wizard guarding her, then walk up to Maria and free her. After the cutscene she becomes a selectable character. Best time: your first playthrough of Stage 2. Common mistake: running past the third candle during the behemoth chase, never getting the key, and then not being able to open her door."},
{n:"Intercepted!",t:"Catch a boss's Magic Crystal before it hits the ground.",b:["story"],tip:"Stand under the boss at the kill moment and catch the falling crystal mid-air.",g:"During boss fights, bosses release a Magic Crystal at certain moments (commonly at a stagger or when defeated). To catch it, position yourself DIRECTLY UNDER the boss at the exact moment the crystal spawns and move to grab it mid-air before it touches the ground. If you miss, it falls and you must retry the stage or fight. Best time: on any early boss you can predict (the Ferryman or Stage 1 boss works well). Common mistake: standing too far from the drop point so you cannot reach the falling crystal in time."},
{n:"Whip it Good",t:"Defeat 15 enemies with Richter's extended whip.",b:["grind"],tip:"Kills during the extended whip animation count; grind weak early enemies.",g:"Hold the attack button down so Richter performs the extended/lunging whip (the whip extends forward with a distinctive animation). Only kills dealt by the EXTENDED portion of the whip count toward the 15. Grind this on weak early enemies in Stage 1 or 2 — repeatedly kill them with the extended whip until the counter hits 15. Best time: Stage 1 or 2 on your first run. Common mistake: killing enemies with the basic short whip, which does not count."},
{n:"Come no more",t:"Test the Ferryman's patience.",b:["missable"],tip:"On the alternate route, ride the Ferryman's boat, then get off and re-board repeatedly until he loses patience.",g:"The Ferryman appears on the ALTERNATE route (Stage 4′). Ride his boat across the water, then when he docks, get OFF and immediately get back ON his boat. Each time you re-board he offers you an item. Keep doing this — get off and re-board over and over — until he finally loses his patience and gives a unique annoyed reaction; the trophy pops the moment he does. Best time: your first time through the alternate Stage 4′. Common mistake: only riding once and leaving — you must get off and re-board several times to wear out his patience."},
{n:"Vampire Killer",t:"Clear any stage with a No-Damage Bonus.",b:["story"],tip:"Save before an easy stage and clear it untouched.",g:"Complete any stage without taking a single hit. The no-damage bonus is awarded on the stage-clear screen. To make this easy, save your game, then replay an early, easy stage (Stage 1 or 2) and play extremely carefully — memorize enemy positions, use holy water to clear paths, and avoid unnecessary risks. If you take any hit, restart the stage rather than continuing. Best time: early in the game when stages are simple. Common mistake: playing the hard later stages where a clean run is much less realistic."},
{n:"You don't belong in this world!",t:"Defeat Dracula as Richter.",b:["story"],tip:"Story completion of your first run.",g:"This is simply completing your first Rondo of Blood playthrough as Richter — reach the final stage, fight Dracula's final form, and defeat him. It is the story-completion trophy and cannot be missed as long as you finish the game. Best time: your first run. Common mistake: none — just beat the final boss."}]},
{id:"rondo2",game:"rondo",kick:"Act 1 · Rondo of Blood",title:"Rondo Cleanup",desc:"Two remaining Rondo trophies: beat Dracula as Maria, then reach 100% map completion.",trophies:[
{n:"Not to be Underestimated",t:"Defeat Dracula as Maria.",b:["story"],tip:"Start a new game as Maria and beat Dracula.",g:"After you have rescued Maria (The Young Huntress), she becomes selectable as a character. Start a NEW GAME from the title screen and choose Maria. Maria plays very differently — she uses dove projectiles and magic instead of a whip — so adapt: stay mobile, use her ranged doves to chip away at bosses, and learn Dracula's final-battle patterns. Clear the game as Maria to unlock. Best time: after your first Richter run, in a second playthrough. Common mistake: playing Maria like Richter and getting punished for melee approaches."},
{n:"The Full Belmonty",t:"Complete 100% of Rondo of Blood.",b:["grind"],tip:"Take every alternate route and hidden room; rarest trophy in the set.",g:"Reveal 100% of the game's map. This requires taking EVERY alternate route and entering EVERY secret room across all stages, including routes that only open when certain girls are rescued. Use a 100% map guide and go stage by stage, checking off every alternate branch and hidden room. This is the rarest and most time-consuming trophy in the set. Best time: after your initial runs, using the stage-select to revisit stages and clear every route. Common mistake: assuming one clean playthrough covers everything — you must deliberately revisit stages to hit alternate paths."}]},
{id:"sotn1",game:"sotn",kick:"Act 2 · Symphony of the Night",title:"Castle Entrance & Royal Chapel",desc:"Early castle. Grab every easy secret before you have the abilities to reach them again.",trophies:[
{n:"Close Associates",img:"img/sotn/sotn-meet-maria.jpg",imgCap:"In-game cutscene: Maria and Alucard meet in the clock room — Maria asks: 'Wait. Are you human? What are you doing here?'",t:"Defeat Slogra and Gaibon.",b:["story"],tip:"First boss pair at the castle entrance.",g:"The first boss fight in Symphony of the Night, in the castle entrance shortly after the prologue. Two bosses appear together — Slogra (spear wielder) and Gaibon (winged fire breather). Fight them with your starting equipment; dodge their pincer attacks, focus one at a time, and use the gap between their attacks. They are unmissable story bosses. Best time: the opening minutes of SOTN. Common mistake: getting cornered between both; keep moving and separate them."},
{n:"...To Forgive, Divine",img:"img/sotn/sotn-confessional.jpg",imgCap:"Royal Chapel confessional booth: Alucard seated, curtain divider and confessor figure; HUD visible.",t:"Visit the confessional in the Royal Chapel.",b:["story","missable"],tip:"In the Royal Chapel tower room, sit on the left chair — a priest appears on the right and pulls the curtain; get up before he attacks.",g:"Go to the Royal Chapel and into the tower room. Take the SECOND exit on the right (counting from the bottom) to reach the confessional. SIT on the LEFT chair — a priest will appear and sit on the right chair, then pull the curtain. The trophy pops just before the priest attacks, so get up (leave your seat) right after it triggers. Best time: your first visit to the Royal Chapel. Common mistake: sitting on the wrong chair, or staying seated long enough to get attacked."},
{n:"A Bird's Life",img:"img/sotn/sotn-telescope.jpg",imgCap:"Outer Wall telescope room with the large telescope apparatus on its mount; HUD visible.",t:"View the circle of life under a telescope.",b:["missable"],tip:"In the far south of the Outer Wall, watch the bird scene under the telescope, then leave and re-enter to watch every different scene.",g:"Go to the very SOUTH of the OUTER WALL area to the room with the telescope (there's a bird's nest below the floor). Look through the telescope and watch a scene of a bird's life — each scene ends with the bird flying away. When it ends, LEAVE the room and come back in, then watch the next scene. Repeat until you've seen every bird-life scene; the trophy unlocks after the last one. Best time: whenever you reach the Outer Wall. Common mistake: watching once and moving on — you must come back several times to trigger all the different scenes."},
{n:"Chock Full",t:"Successfully eat a peanut.",b:["story"],tip:"Equip a peanut, use it to toss it in the air, stand in its fall path, then hold the use button to catch and eat it. [No clean in-game screenshot of this moment is publicly available, so this guide is text-only.]",g:"Equip a PEANUT (found in the castle — the Underground Caverns has early ones). Press the use button and Alucard will TOSS the peanut into the air. Move so you are under the peanut's falling path, then HOLD the use button — Alucard will automatically catch it near his mouth and eat it when it drops into range. That counts as eating it and unlocks the trophy. Best time: any point after you find your first peanut. Common mistake: using it but not holding the button under the fall path, so he never actually eats it."},
{n:"Napsylvania: Lethargy of DisChair",t:"Sit in a chair and fall asleep.",b:["missable"],tip:"In the Long Library, find the room with two chairs (north-east) and sit without touching any button. [No clean in-game screenshot of the chair-sleep moment is publicly available, so this guide is text-only.]",g:"Go to the Long Library and find the room with TWO chairs — it is in the north-east area, reached past a pushable bookshelf that opens a secret room. Sit down in one of the chairs (interact), then DON'T press anything for roughly 10–15 seconds. Alucard will doze off with a Zzz animation and the trophy pops. Best time: whenever you're in the Long Library. Common mistake: pressing buttons or leaving too quickly — you must wait motionless for the sleep animation."},
{n:"Bat Friends Forever!!",img:"img/sotn/sotn-bat-transform.jpg",imgCap:"Alucard in bat form flying through the Long Library bookshelves; HUD visible.",t:"Make friends with the Bat Familiar.",b:["story"],tip:"Have the Bat transformation AND the Bat familiar relic both active, then transform into a bat.",g:"You need two relics active: the BAT transformation (Bat Soul) and the BAT FAMILIAR (the relic that makes a little bat follow you — the \"Echo\"/Card relic). Equip and activate both, then transform into a bat — the moment you do, the little familiar flies with you and the trophy pops. Best time: mid-game once you have both bat relics. Common mistake: only having the transformation but not the familiar relic, or never actually transforming into bat form."}]},
{id:"sotn2",game:"sotn",kick:"Act 2 · Symphony of the Night",title:"Abilities & Exploration",desc:"Collect movement relics and all the quirky off-the-beaten-path trophies before the inverted castle.",trophies:[
{n:"What Could It Be?",img:"img/sotn/sotn-holy-symbol.jpg",imgCap:"Underground Caverns pool room: Alucard on an icy ledge above the deep pool, relic on a pedestal at the water line; HUD visible.",t:"Obtain the Holy Symbol (underwater).",b:["story"],tip:"Find the Holy Symbol relic in the Underground Caverns.",g:"The Holy Symbol relic is found in the UNDERGROUND CAVERNS area of the castle. Collecting it lets Alucard breathe and move freely underwater, which opens up the water-locked zones. Best time: in the natural story order, when you first reach the Caverns. Common mistake: trying to explore underwater zones before getting it and drowning — grab it as soon as the Caverns are reachable."},
{n:"Wish I Was A Baller",img:"img/sotn/sotn-secret-boots.jpg",imgCap:"Underground Caverns giant waterfall room (Secret Boots location); Alucard airborne against the water sheet; HUD visible.",t:"Equip the Secret Boots.",b:["story"],tip:"Secret Boots are in the waterfall room in the Caverns.",g:"The SECRET BOOTS are in the waterfall room in the CAVERNS area. Cross the running water (using your transformations or backdash) to reach the platform on the right, in the middle of the screen, and pick them up. Equip them — they make Alucard appear slightly taller — and the trophy pops. Best time: whenever you explore the Caverns. Common mistake: passing the waterfall room without crossing to the hidden platform."},
{n:"Whip First, Axe Questions Later",img:"img/sotn/sotn-axearmor.jpg",imgCap:"Colosseum combat: armored Axe Knight with its on-screen name banner (the Axe-Knight armor look); HUD visible.",t:"Become an Axe Knight.",b:["story"],tip:"After beating the game, start a NEW GAME and type AXEARMOR as your name, then equip the Axe Armor you start with.",g:"After you have beaten the game once (defeated Dracula in the Inverted Castle), return to the title screen and start a NEW GAME. Enter AXEARMOR as your name / file. After the prologue, once you control Alucard, open your EQUIPMENT menu and you will find a second armor — the AXE ARMOR. Equip it and Alucard becomes an Axe Knight, unlocking the trophy. Best time: after your main completion. Common mistake: expecting to find the armor in the world — it only appears when you start a new game with the AXEARMOR name."},
{n:"Aria of Sorrow",img:"img/sotn/sotn-faerie-sing.jpg",imgCap:"Alucard with the blonde-winged Faerie familiar in a stone passage; HUD visible.",t:"Hear the Fairy Familiar sing.",b:["story"],tip:"Level the Faerie (Déesse) familiar to 10+, then sit in a library chair — it sings.",g:"This trophy is about the FAERIE (Déesse) familiar — not the other fairy-like pets. Get the Faerie relic, activate it, and fight enemies to level the familiar up to at least level 10. Then go to the Long Library, to the room with TWO chairs (north-east area, past the pushable bookshelf), and SIT down. After a moment the faerie will sing a song — stay seated until you hear it and the trophy pops (the same sit also gives you the chair-sleep trophy). Best time: mid-game, once you have the Faerie relic. Common mistake: using the wrong familiar, or not levelling it to 10 before sitting."},
{n:"Make It Rain",img:"img/sotn/sotn-jewel-sword.jpg",imgCap:"In-game equipment menu: Jewel Sword equipped, with the gem stash (Zircon 99, Aquamarine 57, Turquoise 38, Diamond 6...).",t:"Make money with the Jewel Sword.",b:["story"],tip:"Get the Jewel Sword in the Entrance (secret room past the fishmen), then use its special to make coins fly out.",g:"The JEWEL SWORD is found in the ENTRANCE area: in the fishmen room, hit the rock at the top to open a passage on each side; cross it once as a wolf and once as a bat, then head to the south-west of the room to a secret room holding the sword. Equip it and use its special attack — coins burst out of the weapon. Pick one up to earn money and the trophy. It's also your best tool for farming the 500k needed for the Duplicator. Best time: mid-game. Common mistake: swinging it as a normal sword and never doing the special that makes coins fly."},
{n:"Cowstlevania: Portrait of Mooin'",t:"Summon a cow with Shield Rod/Mablung Sword.",b:["missable"],tip:"Equip the Shield Rod (Colosseum) + Leather Shield (Alchemy Lab or buy), then press attack and use together to summon a cow. [No clean in-game screenshot of the cow summon is publicly available, so this guide is text-only.]",g:"This actually needs the SHIELD ROD and the LEATHER SHIELD. The Shield Rod is in the Colosseum; the Leather Shield is in the Alchemy Lab area or can be bought from the Master Librarian. Equip both, then press the attack and use buttons TOGETHER (the shield-rod spell) — a cow is summoned and the trophy pops. Best time: before beating Richter, so you keep access to the normal-castle areas. Common mistake: equipping the wrong combo — it must be Shield Rod + Leather Shield, both equipped."},
{n:"Spelling Bee",img:"img/sotn/sotn-spell-cast.jpg",imgCap:"Soul Steal cast: four blue soul-skulls rising toward Alucard; HUD visible.",t:"Cast every Alucard spell at least once.",b:["story"],tip:"Cast each of Alucard's 8 spells once — a few need the bat, wolf and sword relics.",g:"There are EIGHT spells in total. You can buy the grimoires (spell formulas) from the Master Librarian or just cast them without. Three require specific relics: Wolf Charge needs the Wolf Soul, Wing Smash needs the Bat Soul, and the sword summon (Sword Brothers) needs the Sword Card. The spells are: Dark Metamorphosis, Hellfire, Summon Spirit, Wolf Charge, Wing Smash, Tetra Spirit, Soul Steal, and Sword Brothers. Cast each one at least once in combat (spells cost MP and use the spell input). Best time: mid-to-late game once you have the required relics. Common mistake: missing the three relic-dependent spells because you don't have the bat/wolf/sword relics active."},
{n:"TRACULA...?!",t:"Equip the full Alucart set.",b:["story"],tip:"Get the time-stop sub-weapon in Olrox's Quarters, use it in the Marble Gallery clock room, then double-jump up to the Alucart gear. [No clean in-game screenshot of the full Alucart set is publicly available, so this guide is text-only.]",g:"The \"Alucart\" set (Alucart Sword, Alucart Shield, Alucart Mail) is in a passage you unlock like this: get the TIME-STOP sub-weapon in Olrox's Quarters (the room where you fought the big sword). With it, go to the MARBLE GALLERY clock room (where you first met Maria) and use the time-stop sub-weapon — a high passage on the right opens. Double-jump up to the platform and follow the path to collect all three Alucart pieces. Equip all three at once and the trophy pops. Best time: mid-game once you have the time-stop sub-weapon. Common mistake: holding the pieces but never equipping all three simultaneously."},
{n:"School of Hard Knocks",img:"img/sotn/sotn-master-librarian.jpg",imgCap:"The Master Librarian at his desk under the Long Library bookshelves; Alucard on the right ledge.",t:"Surprise the Master Librarian.",b:["story","missable"],tip:"In the south of the Long Library, stand under the grate below the Librarian's seat and do the High Jump (↑, ↑ then ↓) to pop up and surprise him.",g:"You need the HIGH JUMP (Gravity Boots) relic. Go to the SOUTH part of the Long Library, into the room where there is a vent / grate directly below the Master Librarian's seat. Stand underneath that vent and perform the HIGH JUMP (Up, Up, then Down) so Alucard leaps up through the grate and pops up in front of the old man, surprising him. The trophy unlocks the instant you surprise him. Best time: once you have the High Jump relic and are in the Library. Common mistake: trying to reach him from the front — you must come up from below through the vent."},
{n:"Vampire's Greatest Hits",img:"img/sotn/sotn-transformation-relics.jpg",imgCap:"Relics menu: Soul of Wolf selected alongside Form of Mist; 'Transform into Wolf' toggle shown.",t:"Obtain all transformation relics and upgrades.",b:["story"],tip:"Collect the 10 transformation relics and upgrades (bat, wolf, mist forms and their boosts) across both castles.",g:"You need the transformation relics and their upgrades: the BAT form + its upgrade, the WOLF form + its upgrade, the MIST form + its upgrade, plus Gravity Boots, Leap Stone, Holy Symbol, and the Spirit Orb. There are 30 relics total in the game (7 in the Inverted Castle), and for this trophy you need the transformation-related ones — most of which you'll pick up naturally while completing the map. Best time: during your full 200.6% sweep. Common mistake: finishing before returning for a late-game upgrade relic hidden in a secret room."}]},
{id:"sotn3",game:"sotn",kick:"Act 2 · Symphony of the Night",title:"Boss Rush & the Dawn Warriors",desc:"Work through the mid-castle bosses. The Dawn Warriors trophy is EASY TO MISS — do it here.",trophies:[
{n:"Goodbye Yellow Brick Road",img:"img/sotn/sotn-oz-monsters.jpg",imgCap:"The Lion enemy (one of the denizens of Oz) lunging at Alucard among the Forbidden Library bookshelves; nameplate and HUD visible.",t:"Defeat all three denizens of Oz.",b:["story"],tip:"Defeat one of each — the Scarecrow, the Iron Man (Tin Man), and the Lion — all in the Inverted Long Library.",g:"The three \"Oz\"-themed enemies are all found in the INVERTED Long Library: the Scarecrow (Épouvantail), the Iron Man / Tin Man (Homme de fer), and the Lion. Kill at least one of each and the trophy unlocks. You'll be in this area anyway while farming Schmoos for the Crissaegrim. Best time: in the Inverted Castle, during your Inverted Library sweep. Common mistake: looking for a hidden \"Oz sub-area\" — there isn't one; the three monsters simply spawn as regular enemies in the Inverted Library."},
{n:"You Are Tearing Me Apart, Lisa!",img:"img/sotn/sotn-richter-prologue.jpg",imgCap:"Prologue: Richter vs Dracula in the throne room casting fireballs; hearts counter and boss HP bars visible.",t:"See through the Succubus.",b:["story"],tip:"Defeat the Succubus boss in the dungeon/clock-tower area.",g:"Fight and defeat the Succubus boss in the dungeon / clock-tower area of the castle. She is an unmissable story boss — beating her fulfills the \"see through her deception\" condition. Best time: in the natural story order. Common mistake: none — just win the fight; manage her HP-drain and dodge her attacks."},
{n:"Continue Simon's Quest",img:"img/sotn/sotn-classic-boss.jpg",imgCap:"Clock Tower fight with flying Medusa Heads; 'Medusa Head' nameplate; HUD visible.",t:"Defeat all classic bosses and get Dracula's relics.",b:["story"],tip:"Collect all 5 Dracula relics from the classic bosses across both castles.",g:"You must defeat the classic Castlevania bosses and collect the FIVE Dracula relics they guard (these open the way to the final boss). The relics come from the classic-style bosses found in both the normal and Inverted castle. Story-linked and unmissable — just be thorough in beating each relic boss as you explore. Best time: in natural progression across both castles. Common mistake: beating the game without collecting all five relics and then being unable to reach the final Dracula arena."},
{n:"Dawn of the Dead",img:"img/sotn/sotn-sword-of-dawn.jpg",imgCap:"Alucard in bat form beside the floating Sword of Dawn on a crescent ledge under a giant blue skull; HUD visible.",t:"Summon each Dawn Warrior at least once.",b:["story"],tip:"Get the Sword of Dawn in the Inverted Castle, then use its special to summon all 4 different Dawn Warriors.",g:"In the INVERTED Castle, head to the large hall right after the entrance and go to the NORTH-EAST. On a platform, break the wall just below it to reveal the SWORD OF DAWN. Equip it and use its special attack (the spell input) to summon a Dawn Warrior. There are FOUR different Dawn Warriors — keep using the special until each of the four has appeared at least once, and the trophy unlocks. This is done in the Inverted Castle, so there is no pressure to do it before Richter. Best time: as soon as you enter the Inverted Castle and grab the sword. Common mistake: only summoning one type and assuming it counts — you need all four distinct warriors."}]},
{id:"sotn4",game:"sotn",kick:"Act 2 · Symphony of the Night",title:"The Richter Choice — CRITICAL",desc:"This is the branching point. Get the missable 'bad ending' trophy BEFORE you use the Holy Glasses.",trophies:[
{n:"The Wolves Have All Gone",img:"img/sotn/sotn-warg.jpg",imgCap:"A large dark Warg wolf confronting Alucard in a red-curtained hall; HUD visible.",t:"Defeat Richter WITHOUT the Holy Glasses.",b:["missable","critical"],tip:"CRITICAL: save first, kill Richter without glasses, then reload and use them.",g:"MISSABLE — the bad-ending trophy. SAVE YOUR GAME FIRST. Before taking Maria's Holy Glasses, go fight Richter directly and defeat him WITHOUT the glasses. This triggers the bad ending and pops the trophy. Then RELOAD your save, take the Holy Glasses from Maria, and do the good ending. Best time: at the Richter fight, before you ever accept the glasses. Common mistake: taking the glasses immediately and permanently losing the bad-ending trophy on that save — always save before this fight."},
{n:"Flip It and Reverse It",img:"img/sotn/sotn-richter-boss.jpg",imgCap:"Richter boss pre-battle dialogue with Alucard's portrait; the two face off in the throne chamber.",t:"Defeat Richter with the Holy Glasses, unlock the Inverted Castle.",b:["story"],tip:"Target the floating orb (Shaft) behind Richter, not Richter.",g:"After securing the bad-ending trophy, reload your save, get the Holy Glasses from Maria, and fight Richter again. During the battle, target the floating orb (Shaft) that appears behind him — hit the orb, not Richter. Defeating the orb defeats Richter and unlocks the Inverted Castle. This is the good-ending path. Best time: immediately after the bad-ending trophy. Common mistake: attacking Richter instead of the orb behind him, so the fight never resolves correctly."}]},
{id:"sotn5",game:"sotn",kick:"Act 3 · Inverted Castle",title:"Inverted Castle",desc:"The upside-down castle. Push to Galamoth and Dracula.",trophies:[
{n:"Let The Bodies Hit The Floor",img:"img/sotn/sotn-granfaloon.jpg",imgCap:"Alucard fighting the Granfaloon corpse-ball mass in the Catacombs, released corpses crowding in; HUD visible. Trophy = defeat Granfaloon.",t:"Defeat Granfaloon.",b:["story"],tip:"Mandatory inverted-castle boss; attack the core.",g:"In the Inverted Castle, fight and defeat Granfaloon, the huge mass-of-bodies boss. It is a mandatory inverted-castle boss with a large hitbox; keep attacking its core and avoid being swarmed. Best time: in the natural inverted-castle progression. Common mistake: standing in the middle of its attacks; keep moving around it."},
{n:"Dracula's Curse",img:"img/sotn/sotn-doppleganger.jpg",imgCap:"Alucard vs the zombie Fake Trevor/Sypha/Grant trio emerging from coffins (Inverted Coliseum). Trophy = the Fake trio, not Death.",t:"Defeat zombie Trevor, Sypha, and Grant.",b:["story"],tip:"Fight the zombie Belmont trio; kill them one by one.",g:"In the Inverted Castle, fight the trio of zombie Belmonts — zombie Trevor, zombie Sypha, and zombie Grant — together. It is a story boss in the inverted castle. Focus them one at a time, use area attacks, and manage your HP against three attackers. Best time: natural inverted-castle progression. Common mistake: spreading damage across all three; kill them one by one."},
{n:"Finish What Kid Dracula Started",img:"img/sotn/sotn-galamoth.jpg",imgCap:"Galamoth boss fight: the giant gold-armored boss towering over Alucard; name label and HUD visible.",t:"Defeat Galamoth.",b:["story"],tip:"Boss of the Inverted Catacombs; optional but needed for the 200.6% map.",g:"Galamoth is the boss of the INVERTED Catacombs and is the most powerful (non-final) boss in the game. His defeat is optional for finishing the story but REQUIRED for full map exploration (the 200.6% trophy). Bring the Crissaegrim and lightning-resistant or lightning-absorbing gear. During the fight: when Galamoth raises his staff, if there's an aura around him, transform into mist to dodge his projectiles; if there is NO aura, attack freely — it's a lightning attack that deals little damage or even heals you if you absorb lightning. Best time: during your Inverted Castle completionist sweep. Common mistake: skipping him and then falling short on map percentage."},
{n:"Lisa, forgive me...",img:"img/sotn/sotn-final-dracula.jpg",imgCap:"Final Dracula boss fight (multi-armed four-skull form) in the Inverted Castle Center; HUD visible.",t:"Defeat Dracula in the Inverted Castle Center.",b:["story"],tip:"Collect the 5 Dracula relics, then go to the clock — a secret passage up opens to the final arena.",g:"Final boss of the game. You must first collect the FIVE Dracula relics; then go to the clock room in the Inverted Castle (the area where you fought Maria in the normal castle) and the secret passage leading UP will open, taking you to the final arena. Defeat Dracula in his final form to finish the story and unlock this gold trophy. Bring your best gear — with the Crissaegrim this fight becomes straightforward. Best time: after clearing the Inverted Castle's other bosses. Common mistake: not having all five relics, so the secret passage to the final boss never opens."}]},
{id:"sotn6",game:"sotn",kick:"Act 3 · Cleanup",title:"Grinds & 100%",desc:"The long tail. Map completion, enemy list, the 500k Duplicator, and Crissaegrim farming.",trophies:[
{n:"Running on Schmooze Control",img:"img/sotn/sotn-crissaegrim.jpg",imgCap:"Inverted Forbidden Library: the Schmoo / Crissaegrim drop area; HUD visible.",t:"Obtain the Crissaegrim.",b:["grind"],tip:"Farm Schmoos in the Inverted Long Library — it's a very rare drop.",g:"The Crissaegrim is a rare drop from the SCHMOO enemy, which spawns in the INVERTED Long Library. Farm it by killing every Schmoo in the room, then leave and re-enter to respawn them, and repeat until the Crissaegrim drops. It is the best sword in the game — boost your Luck stat (luck gear or Luck potions) to improve the drop rate. Expect a long grind. Best time: in the Inverted Castle, once you can kill Schmoos reliably. Common mistake: giving up too early — the drop rate is very low, so keep the farm loop going."},
{n:"From Axe Knight to Zombie",img:"img/sotn/sotn-bestiary.jpg",imgCap:"Master Librarian Enemy List (bestiary) panel with a Malachi entry — level, HP, drops, resistances. Trophy = complete the Enemy List.",t:"Complete the Master Librarian's Enemy List.",b:["grind"],tip:"Defeat every enemy (missables excluded) and hunt any \"?\" blanks.",g:"Fill the entire bestiary in the Master Librarian's enemy list by defeating every enemy in the game (the game excludes missable enemies from the requirement). Check the list for any \"?\" blanks and hunt down the missing enemies by visiting their spawn areas. Best time: near the end of your playthrough, once you have seen most of the castle. Common mistake: not cross-checking the list and assuming you have everything."},
{n:"Scientific Progress goes BOINK!",img:"img/sotn/sotn-frankenstein.jpg",imgCap:"Master Librarian buy-item shop menu (price list, ATT/DEF panel, gold) — where the 500,000-gold Duplicator is purchased. Trophy = buy the Duplicator.",t:"Purchase the Duplicator (500,000 gold).",b:["grind"],tip:"Save 500,000 gold and buy it from the Master Librarian; farm gold early.",g:"Save up 500,000 gold and buy the Duplicator from the Master Librarian's shop. This is the single longest grind in the game — start accumulating gold EARLY. The Jewel Sword is an excellent gold-farming tool: swing it at enemies to generate coins. Farm gold steadily so you reach 500k. Best time: throughout the playthrough; start farming early. Common mistake: spending gold on other items and never saving toward the 500k."},
{n:"Technicolor Dreams",img:"img/sotn/sotn-josephs-cloak.jpg",imgCap:"System menu cloak-color RGB sliders (Lining/Exterior) with two Alucard cloak preview sprites.",t:"Equip Joseph's Cloak and set custom colors.",b:["grind"],tip:"Buy Joseph's Cloak (30,000g) from the Master Librarian, equip it, then change its color in the System menu.",g:"Buy the JOSEPH'S CLOAK from the Master Librarian for 30,000 gold (the Jewel Sword is a fast way to earn it). Equip the cloak, then open the System menu → Change Cape Color and modify any color parameter to a custom value. Applying the custom color while wearing the cloak unlocks the trophy. Best time: mid-to-late game once you have the gold. Common mistake: equipping the cloak but never actually changing the color in the System menu."},
{n:"Map Legend",img:"img/sotn/sotn-full-2006.jpg",imgCap:"The full map at 200.6% completion (Normal + Inverted combined).",t:"Reach 200.6% map completion.",b:["grind"],tip:"Reveal every room in both castles; the .6% is tiny hidden rooms.",g:"Fully reveal 200.6% of the map — both the normal castle and the Inverted Castle, including every hidden wall, breakable block, mist door, and secret room. The \".6%\" represents the tiny hidden secret rooms. Use a 200.6% map checklist and methodically cross off every room in both castles. Best time: the very end of your playthrough, after collecting all relics and forms so you can reach everything. Common mistake: missing tiny hidden rooms; use a map guide and verify every single one."},
{n:"Shafted",img:"img/sotn/sotn-shaft-boss.jpg",imgCap:"Shaft's boss-introduction dialogue frame in the Inverted Castle Center; the arena is identical in Richter mode.",t:"Play as Richter and defeat Shaft in the Inverted Castle.",b:["story"],tip:"After beating the game, start a NEW GAME and type RICHTER as your name, then reach the Inverted Castle and kill Shaft.",g:"After defeating Dracula in the Inverted Castle (good ending), return to the title screen and start a NEW GAME with RICHTER as your name / file — this makes you control Richter instead of Alucard. Play through the normal castle to the Inverted Castle (there are no bosses on this run) and reach the CENTER of the Inverted Castle, where Shaft awaits. Defeat Shaft — the Holy Water sub-weapon makes this fight trivial. Best time: after your main completion. Common mistake: using your old save instead of starting a new game with the RICHTER name."}]}
];

/* ================= MAP DATA (schematic reference maps) ================= */
function R(id,x,y,w,h,label,cls){return{id,x,y,w,h,label,cls:cls||"normal"}}

const KEY="sotn_trophy_path_static_v1";
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){state={};}
let view="trophies", activePhase="all", filter="all", query="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function isDone(id){return !!state[id];}
function total(){let n=1;PHASES.forEach(p=>n+=p.trophies.length);return n;}
function done(){let n=0;PHASES.forEach(p=>p.trophies.forEach(t=>{if(isDone(p.id+"::"+t.n))n++;}));if(isDone("platinum"))n++;return n;}

function tier(name){
  if(name===PLATINUM.n)return"platinum";
  const g=["The Full Belmonty","Lisa, forgive me...","Map Legend"];
  if(g.includes(name))return"gold";
  const s=["Vampire Killer","You don't belong in this world!","Not to be Underestimated","Continue Simon's Quest","The Wolves Have All Gone","Flip It and Reverse It","Shafted","TRACULA...?!","Spelling Bee","Vampire's Greatest Hits","From Axe Knight to Zombie","Finish What Kid Dracula Started"];
  if(s.includes(name))return"silver";return"bronze";
}
function trophySVG(tier){
  const c={platinum:["#ececf1","#b6b6c2"],gold:["#f9dd85","#c9971a"],silver:["#e8eaef","#a4a9b1"],bronze:["#e3b78f","#a9743f"]}[tier]||["#e3b78f","#a9743f"];
  const id="tg"+tier;
  return `<svg class="tbadge-svg" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><path d="M8 5h16v6a8 8 0 0 1-16 0z" fill="url(#${id})"/><path d="M8 8H5a3.5 3.5 0 0 0 3.5 3.5" fill="none" stroke="url(#${id})" stroke-width="2.5" stroke-linecap="round"/><path d="M24 8h3a3.5 3.5 0 0 1-3.5 3.5" fill="none" stroke="url(#${id})" stroke-width="2.5" stroke-linecap="round"/><path d="M15 17h2v4h-2z" fill="url(#${id})"/><path d="M11 21h10v2H11z" fill="url(#${id})"/><path d="M13 23h6v2h-6z" fill="url(#${id})"/></svg>`;
}

function renderSidebar(){
  const sb=document.getElementById("sidebar");
  let h='<div class="side-label">Walkthrough</div>';
  h+=side("all","All Trophies","#8e8e93",total(),done());
  h+='<div class="side-label">Rondo of Blood</div>';
  PHASES.filter(p=>p.game==="rondo").forEach(p=>h+=side(p.id,p.title,"#e05d5d",p.trophies.length,p.trophies.filter(t=>isDone(p.id+"::"+t.n)).length));
  h+='<div class="side-label">Symphony of the Night</div>';
  PHASES.filter(p=>p.game==="sotn").forEach(p=>h+=side(p.id,p.title,"#3f8fd0",p.trophies.length,p.trophies.filter(t=>isDone(p.id+"::"+t.n)).length));
  h+='<div class="side-label">Reference</div>';
  h+=side("mapguide","Map Guide","#8e8e93",0,0);
  h+=side("sotnmaps","SOTN Maps","#3f8fd0",0,0);
  h+=side("rondomaps","Rondo Maps","#e05d5d",0,0);
  sb.innerHTML=h;
  sb.querySelectorAll(".side-item").forEach(el=>el.onclick=()=>{setView(el.dataset.id);document.getElementById("sidebar").classList.remove("open");document.getElementById("scrim").classList.remove("show");});
}
function side(id,title,color,total,done){
  const act=(view===id||(view==="trophies"&&activePhase===id))?" active":"";
  const cnt = id==="mapguide"||id==="sotnmaps"||id==="rondomaps" ? "" : `<span class="cnt ${done===total&&total>0?'done':''}">${done}/${total}</span>`;
  return `<div class="side-item${act}" data-id="${id}"><span class="dot" style="background:${color}"></span>${title}${cnt}</div>`;
}

function visiblePhases(){
  let list=PHASES.slice();
  if(filter==="sotn")list=list.filter(p=>p.game==="sotn");
  else if(filter==="rondo")list=list.filter(p=>p.game==="rondo");
  if(activePhase!=="all")list=list.filter(p=>p.id===activePhase);
  return list;
}
function renderTrophies(){
  const m=document.getElementById("main");
  let h="";
  const pd=isDone("platinum");
  h+=`<div class="platinum-card" style="${pd?'border-color:#2e8b57':''}"><div class="medal">Pt</div><div><h3>${PLATINUM.n}</h3><p>${PLATINUM.t}</p></div></div>`;
  let shown=0;
  visiblePhases().forEach(p=>{
    let rows=p.trophies.map(t=>{
      const id=p.id+"::"+t.n,dn=isDone(id);
      if(filter==="missable"&&!t.b.includes("missable"))return"";
      if(filter==="todo"&&dn)return"";
      if(query&&!(t.n.toLowerCase().includes(query)||t.t.toLowerCase().includes(query)))return"";
      shown++;
      const ti=tier(t.n);
      let bd=t.b.map(b=>{
        const map={missable:"Missable",critical:"Critical",grind:"Grind",story:"Story"};
        return`<span class="badge ${b}">${map[b]}</span>`;
      }).join("");
      return`<div class="trophy ${dn?'done':''}" data-id="${id}">
        <div class="trow"><div class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0b0b0d" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg></div>
        <div class="tbadge">${trophySVG(ti)}</div>
        <div class="tb"><div class="tn">${t.n}</div><div class="ts">${t.t}</div></div>
        <div class="badges">${bd}</div>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
        <div class="tdetail"><div class="tdi">
          <strong>${t.t}</strong>
          ${t.b.includes("critical")?`<div class="tip crit">⚠ CRITICAL — ${t.tip}</div>`:(t.b.includes("missable")?`<div class="tip warn">⚠ Missable — ${t.tip}</div>`:`<div class="tip">Tip: ${t.tip}</div>`)}
          <div class="guide-block"><h4>How to unlock</h4><p>${t.g}</p></div>
          ${t.img?`<div class="guide-img"><img src="${t.img}" alt="${t.n}" loading="lazy"><div class="gi-cap">${t.imgCap||""}</div></div>`:""}
        </div></div></div>`;
    }).join("");
    if(!rows)return;
    h+=`<div class="phase-head"><div class="pk">${p.kick}</div><div class="pt">${p.title}</div><div class="pd">${p.desc}</div></div>${rows}`;
  });
  if(shown===0)h+=`<div class="empty">No trophies match this view.</div>`;
  h+=`<div class="footnote">Castlevania Requiem (PS4 / playable on PS5). 44 trophies total — 1 platinum, 3 gold, 12 silver, 28 bronze. Tick a trophy to save it in this browser. Critical missables: do them before beating Richter / entering the Inverted Castle.</div>`;
  m.innerHTML=h;
  m.querySelectorAll(".trophy").forEach(row=>{
    const id=row.dataset.id;
    row.querySelector(".trow").onclick=e=>{
      if(e.target.closest(".check")){
        state[id]=!state[id];
        if(PHASES.every(p=>p.trophies.every(t=>isDone(p.id+"::"+t.n))))state["platinum"]=true;
        save();renderAll();
      }else row.classList.toggle("open");
    };
  });
}

function renderMapSVG(map){
  let maxX=20,maxY=20;
  map.rooms.forEach(r=>{maxX=Math.max(maxX,r.x+r.w);maxY=Math.max(maxY,r.y+r.h);});
  const W=maxX+40,H=maxY+40;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fbfbfd"/>`;
  map.conns.forEach(c=>{
    const a=map.rooms.find(r=>r.id===c[0]),b=map.rooms.find(r=>r.id===c[1]);
    const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
    s+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#b9b9c0" stroke-width="3"/>`;
  });
  map.rooms.forEach(r=>{
    const fill=COLORS[r.cls],st=STROKE[r.cls];
    const dash=(r.cls==="secret"||r.cls==="mist")?' stroke-dasharray="6,4"':"";
    s+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6" fill="${fill}" stroke="${st}" stroke-width="2"${dash}/>`;
    const lines=r.label.split("\n");
    const fs=Math.min(12,Math.max(9,r.w/11));
    let tspans="";
    lines.forEach((l,i)=>{tspans+=`<tspan x="${r.x+r.w/2}" dy="${i===0?(-(lines.length-1)*(fs+2)/2):(fs+2)}">${l}</tspan>`;});
    s+=`<text x="${r.x+r.w/2}" y="${r.y+r.h/2}" fill="#333" font-size="${fs}" font-weight="600" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial">${tspans}</text>`;
  });
  s+="</svg>";
  return s;
}
function renderMaps(maps,title){
  const m=document.getElementById("main");

  maps.forEach(map=>{
    h+=`<div class="mapcard"><h3>${map.title}</h3><div class="cap">${map.cap}</div><div class="mapsvg">${renderMapSVG(map)}</div></div>`;
  });
  m.innerHTML=h;
}

    {src:"img/sotn/sotn-normal-map.jpg",title:"Normal Castle — Full Map",cap:"The complete first (normal) castle at full map completion — the upper half of the 200.6% total. Use it to confirm every room is uncovered. Tap the image to open it full-resolution and pinch-zoom."},
    {src:"img/sotn/sotn-inverted-map.jpg",title:"Inverted Castle — In-Game Map",cap:"The actual in-game INVERTED CASTLE map screen. Every room mirrored from the normal castle; follow this while exploring the second half. Tap to open full-res."},
    {src:"img/sotn/sotn-full-2006.jpg",title:"Full 200.6% — Normal + Inverted",cap:"Both castles combined into the complete 200.6% layout (Inverted on top, Normal below) — the true end-to-end map you work toward. Tap to open full-res."}
  ];
  let h=`<div class="maphdr"><div class="pk">Reference</div><div class="pt">Symphony of the Night Maps</div></div><div class="guidepage">`;
  h+=`<div class="guide-section"><h2>Exact in-game full maps</h2><p class="sub">The real SOTN castle maps — normal, inverted, and the full 200.6% composite. Tap any image to open it full-size on your phone, then pinch to zoom and trace your exploration.</p></div>`;
  maps.forEach(mm=>{
    h+=`<div class="realmap-card"><a class="rm-link" href="${mm.src}" target="_blank" rel="noopener"><img src="${mm.src}" alt="${mm.title}" loading="lazy"></a><div class="realmap-body"><h3>${mm.title}</h3><p>${mm.cap}</p><span class="rm-hint">Tap to open full-size</span></div></div>`;
  });
  h+=`</div>`;
  m.innerHTML=h;
}
function renderRondoStages(){
  const m=document.getElementById("main");
  let h=`<div class="maphdr"><div class="pk">Reference</div><div class="pt">Rondo of Blood Maps</div></div><div class="guidepage">`;
  h+=`<div class="guide-section"><h2>How the stages link</h2><p class="sub">Main route: ${RONDO_ROUTE.main.join(" → ")}.<br>${RONDO_ROUTE.alt}</p><ul><li>To reach 100% (The Full Belmonty) you must clear all 8 main stages AND the alternate branch 2′–6′, rescue all four maidens, and beat every boss.</li><li>Annette is on the MAIN route (Stage 7); Maria is on Stage 2; Tera and Iris are on the alternate route (Stage 3′ and Stage 4′).</li></ul></div>`;
  RONDO_STAGES.forEach(s=>{
    h+=`<div class="stage-card"><div class="sc-img"><img src="${s.img}" alt="${s.stage}" loading="lazy"></div><div class="sc-body"><h3>${s.stage}</h3><div>${s.tags.map(t=>`<span class="sc-tag${t.indexOf('Rescue')>-1?' rescue':''}">${t}</span>`).join("")}</div><p class="sc-cap">${s.cap}</p></div></div>`;
  });
  h+=`</div>`;
  m.innerHTML=h;
}
function renderMapGuide(){
  const m=document.getElementById("main");
  let h=`<div class="maphdr"><div class="pk">Reference</div><div class="pt">Map Guide</div></div><div class="guidepage">`;
  MAPGUIDE.forEach(sec=>{
    h+=`<div class="guide-section"><h2>${sec.title}</h2><p class="sub">${sec.intro}</p>`;
    sec.sections.forEach(s=>{h+=`<h3>${s.h}</h3><ul>${s.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;});
    h+=`</div>`;
  });
  h+=`</div>`;
  m.innerHTML=h;
}

function renderProgress(){
  const d=done(),t=total();
  document.getElementById("pfill").style.width=(d/t*100)+"%";
  document.getElementById("ppct").textContent=d+" / "+t;
}
function setView(v){
  if(v==="mapguide")view="mapguide";
  else if(v==="sotnmaps")view="sotnmaps";
  else if(v==="rondomaps")view="rondomaps";
  else {view="trophies";activePhase=v;}
  renderAll();
}
function renderMain(){
  if(view==="mapguide")renderMapGuide();
  else if(view==="sotnmaps")renderSotnMaps();
  else if(view==="rondomaps")renderRondoStages();
  else renderTrophies();
}
function renderAll(){renderProgress();renderSidebar();renderMain();}

document.getElementById("seg").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.f;renderAll();};
});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value.toLowerCase().trim();renderMain();});
document.getElementById("hamburger").onclick=()=>{document.getElementById("sidebar").classList.add("open");document.getElementById("scrim").classList.add("show");};
document.getElementById("scrim").onclick=()=>{document.getElementById("sidebar").classList.remove("open");document.getElementById("scrim").classList.remove("show");};
renderAll();
</script>
</body>
</html>
